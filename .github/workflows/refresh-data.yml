name: Refresh processed market data

on:
  push:
    paths:
      - "data/incoming/**"
      - "src/data_pipeline.py"
      - "scripts/update_data.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inside-the-valley-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build persistent transaction history
        run: python scripts/update_data.py
      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/sales.csv data/processed/rentals.csv
          if git diff --cached --quiet; then
            echo "No new transactions to commit."
          else
            git commit -m "Refresh Inside The Valley market data"
            git push
          fi
